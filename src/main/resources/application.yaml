spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: device-service

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    # Only the device changesets. The schema is shared with energy-monitor-backend and the security
    # service (ADR-003), and so is the DATABASECHANGELOG table: each service applies its own
    # changelogs.
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  # 8080 is the API gateway, 8082 the security service and 8083 energy-monitor-backend when all
  # run on the same machine.
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
