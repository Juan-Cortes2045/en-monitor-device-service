spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: device-service

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    # Only the device changesets. The schema is shared with energy-monitor-backend and the security
    # service (ADR-003), and so is the DATABASECHANGELOG table: each service applies its own
    # changelogs.
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Message broker (RabbitMQ, from infra): the device events this service announces, and the
  # home events it consumes. Each consumer declares and binds its own queue.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:energy-monitor}
    password: ${RABBITMQ_PASSWORD:}
    # A message is marked as published only after the broker confirms it and a queue took it
    # (correlated: the return of an unrouted message is known before the confirmation completes).
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # A message that keeps failing is retried three times, one, two and four seconds apart,
        # and then moved to the dead-letter queue of its queue instead of blocking the ones behind.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

server:
  # 8080 is the API gateway, 8082 the security service and 8083 energy-monitor-backend when all
  # run on the same machine.
  port: ${SERVER_PORT:8084}
  # The web and mobile requests come through the API gateway: from it (loopback or a Docker
  # network) the container takes the caller's address and scheme from X-Forwarded-For and
  # X-Forwarded-Proto. A call from outside relayed with a forwarded address therefore counts as
  # that address, and the internal API and the broker authentication refuse it.
  forward-headers-strategy: native
  tomcat:
    # Only loopback (the gateway or nginx on this machine) and the Docker networks may set it: the
    # default would trust every private network, and a machine of the LAN could then pass as
    # 127.0.0.1.
    remoteip:
      internal-proxies: "127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"

messaging:
  # Topic exchange of everything this service announces; the routing keys are the message types
  # (device.linked, device.unlinked, device.connectivity-lost, device.connectivity-restored).
  # The outbox relay runs every second, up to 50 messages, each confirmed by the broker within 5 s.
  exchange: energy-monitor.device
  # Topic exchange energy-monitor-backend publishes the home events to (home.deleted), and the
  # dead-letter exchange of the queues this service consumes.
  home-exchange: energy-monitor.home
  dead-letter-exchange: device-service.dlx
  relay-enabled: true
  poll-interval: PT1S
  batch-size: 50
  confirm-timeout: PT5S

security:
  jwt:
    # The access tokens are issued by the security service; this service only validates them, with
    # the service's public key and its iss claim (the value the monolith used, kept unchanged).
    issuer: https://energy-monitor-backend
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:}

# Calls between this service and energy-monitor-backend, both ways: it asks whether a caller
# belongs to or owns a home (no answer within the timeouts refuses the request with 503), and the
# backend reads devices from /internal/devices/** and /internal/homes/**. Each side checks the
# other's network and the shared token; the reverse proxy never forwards /internal/**.
internal-api:
  # Same value in every service. Empty refuses every inbound internal call.
  # Generate with: openssl rand -hex 32
  token: ${INTERNAL_API_TOKEN:}
  allowed-networks: ${INTERNAL_API_ALLOWED_NETWORKS:127.0.0.1/32,::1/128,172.16.0.0/12}
  backend-url: ${BACKEND_INTERNAL_URL:http://localhost:8083}
  connect-timeout: PT1S
  read-timeout: PT2S

mqtt:
  # This service connects over the plain listener: the broker runs next to it, so this connection
  # never leaves the host; devices use TLS.
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  # Suffixed per client (-commands, -telemetry, -status). Must differ per instance and from
  # energy-monitor-backend's, which subscribes to the same topics.
  client-id: ${MQTT_CLIENT_ID:device-service}
  # Also the credentials the broker accepts for this service: the broker asks
  # /internal/mqtt/auth/user, and these are compared there, so they live in one place.
  username: ${MQTT_DEVICE_SERVICE_USER:em-device-service}
  password: ${MQTT_DEVICE_SERVICE_PASS:}
  # Subscriptions for the connectivity (suffixed -telemetry and -status): every telemetry message
  # refreshes last_seen, and the retained status messages, last will included, set ONLINE/OFFLINE.
  inbound:
    enabled: true
  topics:
    telemetry: energy-monitor/devices/+/telemetry
    status: energy-monitor/devices/+/status
  qos: 0
  keep-alive-interval: 60
  clean-session: true
  connection-timeout: 30
  # How long a subscribe, unsubscribe or disconnect waits for the broker, and how long a stopping
  # subscription lets in-flight work finish (Paho waits 30 s for each).
  completion-timeout: PT5S
  broker-auth:
    # energy-monitor-backend's broker credentials (its MQTT_BACKEND_USER and MQTT_BACKEND_PASS):
    # it may only read the telemetry and status of every device.
    backend-username: ${MQTT_BACKEND_USER:em-backend}
    backend-password: ${MQTT_BACKEND_PASS:}
    # The measurement service's broker credentials (its MQTT_MEASUREMENT_SERVICE_USER and
    # MQTT_MEASUREMENT_SERVICE_PASS): it may only read the telemetry of every device.
    measurement-username: ${MQTT_MEASUREMENT_SERVICE_USER:em-measurement-service}
    measurement-password: ${MQTT_MEASUREMENT_SERVICE_PASS:}
    # Addresses allowed to call /internal/mqtt/auth/**: loopback and the private range Docker
    # uses, where the broker container lives. Narrow it in production if the network allows it.
    allowed-networks: ${MQTT_AUTH_ALLOWED_NETWORKS:127.0.0.1/32,::1/128,172.16.0.0/12}

device:
  connectivity:
    # A device not heard from for this long is marked OFFLINE. Telemetry comes every 60 s at
    # QoS 0, so one lost sample plus network jitter is tolerated before declaring it gone.
    offline-after: ${DEVICE_OFFLINE_AFTER:PT150S}
    check-interval: PT30S
  provisioning:
    # Broker address the web app writes to a module over Bluetooth when linking it. It must be
    # reachable from the home network: the LAN IP of this PC in development, the public domain
    # of the broker in production. Never localhost.
    mqtt-host: ${DEVICE_MQTT_PUBLIC_HOST:}
    mqtt-port: ${DEVICE_MQTT_PUBLIC_PORT:8883}

management:
  endpoints:
    web:
      exposure:
        include: health,info
